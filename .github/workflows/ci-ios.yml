name: WebDriverIO iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-ios:
    name: Executar Testes iOS
    runs-on: macos-14
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar e configurar Appium e Driver XCUITest
        run: |
          npm install -g appium
          # Instala a última versão major 7 do driver, que é 100% compatível com Appium 2.x
          appium driver install xcuitest@7

      - name: Iniciar o Simulador do iPhone
        run: |
          xcrun simctl boot "iPhone 15" || true

      - name: Executar os testes de iOS
        run: npm run test:ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 🔐 Vacina contra o Rate Limit da API do GitHub

      # 📥 Upload dos resultados salvos para o centralizador ci-report coletar depois
      - name: Salvar Resultados do iOS
        if: always() # Garante o upload mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          path: allure-results
          retention-days: 1