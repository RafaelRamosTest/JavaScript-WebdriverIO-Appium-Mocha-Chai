name: WebDriverIO Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-android:
    name: Executar Testes Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Executar os testes de Android
        run: npm run test:android

      - name: Upload dos resultados do Allure
        uses: actions/upload-artifact@v4
        if: always() # Garante o upload mesmo se os testes falharem
        with:
          name: allure-results-android
          path: allure-results/ # Alinhado com a pasta padrão de relatórios do WDIO

  deploy-report:
    name: Publicar Allure Report Android
    runs-on: ubuntu-latest
    needs: [test-android]
    if: always()
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Criar diretório de resultados
        run: mkdir -p allure-results

      - name: Baixar resultados do Android
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-android
          path: allure-results

      - name: Capturar histórico do Allure (GitHub Pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Gerar o Allure Report
        uses: simple-elf/allure-report-action@main
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages