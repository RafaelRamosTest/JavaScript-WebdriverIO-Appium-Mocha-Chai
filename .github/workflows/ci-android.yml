name: WebDriverIO Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-android:
    name: Executar Testes Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Habilitar aceleração KVM (Hardware)
        run: |
          echo "🚀 Configurando aceleração para o emulador..."
          sudo chown $USER /dev/kvm

      - name: Executar testes no Emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: npm run test:android

      - name: Salvar Resultados do Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          path: allure-results
          retention-days: 1

      # 📊 ETAPAS DO RELATÓRIO
      - name: Configurar Java
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Allure CLI
        if: always()
        run: |
          curl -o allure.tgz -QsL https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Gerar Relatório Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Publicar Relatório no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages