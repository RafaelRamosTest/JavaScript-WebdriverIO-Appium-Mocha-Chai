# Pipeline de CI/CD para o projeto de testes em WebdriverIO com GitHub Actions

name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Roda na nightly às 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  test-android:
    name: Test Android (Emulator)
    runs-on: macos-latest
    strategy:
      matrix:
        api-level: [ 33 ]
        target: [ google_apis ]
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar e configurar Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Rodar testes no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          script: npm run test:android

      - name: Upload dos Relatórios
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-reports
          path: ./reports
          retention-days: 7

  test-browserstack:
    name: Test BrowserStack (Cloud)
    runs-on: ubuntu-latest
    # Roda apenas se as credenciais estiverem configuradas nos Secrets do GitHub
    if: ${{ vars.RUN_BS_TESTS == 'true' }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes no BrowserStack
        env:
          BROWSERSTACK_USER: ${{ secrets.BROWSERSTACK_USER }}
          BROWSERSTACK_KEY: ${{ secrets.BROWSERSTACK_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
        run: npm run test:bs

      - name: Upload dos Relatórios
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: browserstack-reports
          path: ./reports
          retention-days: 7