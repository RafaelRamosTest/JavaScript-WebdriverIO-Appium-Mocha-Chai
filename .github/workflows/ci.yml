# Pipeline de CI/CD para o projeto de testes em WebdriverIO com GitHub Actions
name: Mobile Tests CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Roda na nightly às 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  test-android:
    name: Test Android (Emulator)
    runs-on: macos-latest
    strategy:
      matrix:
        api-level: [ 33 ]
        target: [ google_apis ]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar e configurar Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2 || appium driver update uiautomator2

      - name: Rodar testes no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          script: npm run test:android
        continue-on-error: true # Garante a geração do report mesmo se houver falhas de teste

      - name: Upload dos Resultados Brutos do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results
          retention-days: 1

  test-browserstack:
    name: Test BrowserStack (Cloud)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_BS_TESTS == 'true' }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes no BrowserStack
        env:
          BROWSERSTACK_USER: ${{ secrets.BROWSERSTACK_USER }}
          BROWSERSTACK_KEY: ${{ secrets.BROWSERSTACK_KEY }}
          BROWSERSTACK_APP_ID: ${{ secrets.BROWSERSTACK_APP_ID }}
        run: npm run test:bs
        continue-on-error: true

      - name: Upload dos Resultados Brutos do Allure (BS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bs
          path: allure-results
          retention-days: 1

  deploy-report:
    name: Publicar Allure Report
    runs-on: ubuntu-latest
    needs: [test-android, test-browserstack]
    if: always() # Garante a publicação independente do resultado dos testes
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Criar diretório de resultados
        run: mkdir allure-results

      - name: Baixar resultados do Android (se houver)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-android
          path: allure-results

      - name: Baixar resultados do BrowserStack (se houver)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-bs
          path: allure-results

      - name: Capturar histórico do Allure (GitHub Pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dir
        continue-on-error: true

      - name: Gerar o Allure Report
        uses: simple-elf/allure-report-action@main
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publicar relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages