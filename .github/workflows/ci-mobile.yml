name: WebDriverIO Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: sudo chown $USER /dev/kvm
      - name: Execução Testes Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: npm run test:android
      - name: Salvar Resultados Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: allure-results
          retention-days: 1

  test-ios:
    runs-on: macos-14
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Execução Testes IOS
        run: |
          npm install -g appium
          appium driver install xcuitest@7
          xcrun simctl boot "iPhone 15" || true
          npm run test:ios
      - name: Salvar Resultados IOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results
          retention-days: 1

  generate-report:
    needs: [test-android, test-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: all-results
      - name: Configurar Java e Allure
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: |
          curl -o allure.tgz -QsL https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
      - name: Gerar Relatório Consolidado
        run: allure generate all-results/allure-results-android all-results/allure-results-ios --clean -o allure-report
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages