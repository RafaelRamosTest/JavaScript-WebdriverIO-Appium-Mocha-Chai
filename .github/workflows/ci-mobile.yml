name: WebDriverIO Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 🤖 JOB DO ANDROID (Roda em paralelo no Linux)
  test-android:
    name: Executar Testes Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Habilitar aceleração KVM (Hardware)
        run: |
          echo "🚀 Configurando aceleração para o emulador..."
          sudo chown $USER /dev/kvm

      - name: Executar testes no Emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          # ⚡ CORREÇÃO AQUI: Trocado '-gpu l जोड़ा' pelo driver estável 'swiftshader_indirect'
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            echo "⏳ Aguardando o sistema do Android responder por completo..."
            adb wait-for-device
            # Trava o pipeline até que a interface do usuário (Home Screen) esteja carregada
            until adb shell getprop sys.boot_completed | grep -m 1 "1"; do
              sleep 3
            done
            echo "✅ Android carregado com sucesso! Iniciando os testes..."
            npm run test:android

      - name: Salvar Resultados do Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          path: allure-results
          retention-days: 1

  # 🍏 JOB DO IOS (Roda em paralelo no Mac)
  test-ios:
    name: Executar Testes iOS
    runs-on: macos-14
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar e configurar Appium e Driver XCUITest
        run: |
          npm install -g appium
          appium driver install xcuitest@7

      - name: Iniciar o Simulador do iPhone
        run: |
          xcrun simctl boot "iPhone 15" || true

      - name: Executar os testes de iOS
        run: npm run test:ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar Resultados do iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          path: allure-results
          retention-days: 1

  # 📊 JOB DE UNIFICAÇÃO (Espera os dois anteriores terminarem)
  generate-report:
    name: Consolidated Allure Report
    needs: [test-android, test-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configurar Java (Necessário para o Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Allure CLI de forma nativa
        run: |
          echo "📥 Baixando Allure CLI..."
          curl -o allure-commandline.tgz -QsL https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.tgz
          tar -zxf allure-commandline.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Baixar Histórico do Allure (GitHub Pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-history
        continue-on-error: true

      - name: Baixar Resultados do Android
        uses: actions/download-artifact@v4
        with:
          name: results-android
          path: combined-results
        continue-on-error: true

      - name: Baixar Resultados do iOS
        uses: actions/download-artifact@v4
        with:
          name: results-ios
          path: combined-results
        continue-on-error: true

      - name: Mesclar Histórico de Execuções
        run: |
          mkdir -p combined-results
          if [ -d "allure-history/history" ]; then
            cp -r allure-history/history combined-results/
          fi

      - name: Gerar Allure Report Unificado de forma nativa
        run: |
          allure generate combined-results --clean -o allure-report-output

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report-output
          publish_branch: gh-pages