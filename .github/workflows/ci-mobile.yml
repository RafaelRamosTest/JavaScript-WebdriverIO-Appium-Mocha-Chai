name: WebDriverIO Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 🤖 JOB DO ANDROID
  test-android:
    name: Executar Testes Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Habilitar aceleração KVM
        run: sudo chown $USER /dev/kvm

      - name: Executar testes no Emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          # Parâmetros de performance otimizados para o GitHub Actions
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            echo "⏳ Aguardando boot completo do Android..."
            adb wait-for-device
            # Trava o pipeline usando um loop interno dentro do shell do dispositivo
            adb shell "while [ \"$(getprop sys.boot_completed)\" != '1' ]; do sleep 3; done"
            echo "✅ Android carregado! Iniciando testes..."
            npm run test:android

      - name: Salvar Resultados do Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          path: allure-results
          retention-days: 1

  # 🍏 JOB DO IOS
  test-ios:
    name: Executar Testes iOS
    runs-on: macos-14
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Configurar Appium e Driver
        run: |
          npm install -g appium
          appium driver install xcuitest@7

      - name: Iniciar Simulador e Executar Testes
        run: |
          xcrun simctl boot "iPhone 15" || true
          npm run test:ios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar Resultados do iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          path: allure-results
          retention-days: 1

  # 📊 JOB DE RELATÓRIO
  generate-report:
    name: Consolidated Allure Report
    needs: [test-android, test-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Baixar e Instalar Allure CLI
        run: |
          curl -o allure-commandline.tgz -QsL https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.29.0/allure-commandline-2.29.0.tgz
          tar -zxf allure-commandline.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Baixar Resultados
        uses: actions/download-artifact@v4
        with:
          path: combined-results

      - name: Gerar Report
        run: allure generate combined-results --clean -o allure-report-output

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report-output
          publish_branch: gh-pages